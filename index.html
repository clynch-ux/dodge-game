<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dodge Drive</title>
  <style>
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: linear-gradient(#0a0d12, #111827);
      font-family: Arial, sans-serif;
      color: white;
    }

    #gameWrap {
      position: relative;
      width: 520px;
      height: 520px;
      border: 4px solid #dfe7ef;
      background: #111827;
      box-shadow: 0 0 30px rgba(125, 211, 252, 0.2);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0f172a;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      border-radius: 8px;
    }

    #startOverlay,
    #message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.48);
      z-index: 3;
    }

    #startOverlay {
      background: rgba(10, 14, 22, 0.72);
    }

    #startOverlay.hidden,
    #message.hidden {
      display: none;
    }

    .small {
      font-size: 16px;
      opacity: 0.9;
      display: block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <div id="hud">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
    <canvas id="gameCanvas" width="520" height="520"></canvas>

    <div id="startOverlay">
      <div>
        <div style="font-size: 36px;">Dodge Drive</div>
        <span class="small">Press an arrow key or Space to start</span>
      </div>
    </div>

    <div id="message" class="hidden">
      <div>
        <div>Game Over</div>
        <span class="small">Press Space to restart</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const startOverlay = document.getElementById("startOverlay");
    const messageEl = document.getElementById("message");

    const W = canvas.width;
    const H = canvas.height;
    const keys = {};

    let started = false;
    let gameOver = false;
    let score = 0;
    let best = Number(localStorage.getItem("dodge-best") || 0);
    let spawnTimer = 0;

    bestEl.textContent = best;

    const player = {
      x: W / 2,
      y: H - 62,
      w: 36,
      h: 58,
      speed: 5.5
    };

    const obstacles = [];

    function resetGame() {
      player.x = W / 2;
      player.y = H - 62;
      obstacles.length = 0;
      spawnTimer = 0;
      score = 0;
      scoreEl.textContent = score;
      started = false;
      gameOver = false;
      startOverlay.classList.remove("hidden");
      messageEl.classList.add("hidden");
    }

    function startGame() {
      if (started || gameOver) return;
      started = true;
      startOverlay.classList.add("hidden");
    }

    function spawnObstacle() {
      const roadLeft = W * 0.24;
      const roadRight = W * 0.76;
      const laneCount = 3;
      const laneWidth = (roadRight - roadLeft) / laneCount;
      const lane = Math.floor(Math.random() * laneCount);

      const x = roadLeft + lane * laneWidth + laneWidth / 2;
      const w = 22 + Math.random() * 18;
      const h = 28 + Math.random() * 20;
      const y = -h - 20;
      const speed = 3.2 + Math.random() * 3 + score * 0.05;

      obstacles.push({
        x: x - w / 2,
        y,
        w,
        h,
        vy: speed,
        color: `hsl(${Math.random() * 60 + 10}, 85%, 60%)`
      });
    }

    function update() {
      if (!started || gameOver) return;

      if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
      if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;
      if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
      if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;

      player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
      player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

      spawnTimer += 1;
      if (spawnTimer > Math.max(20, 52 - score * 0.5)) {
        spawnObstacle();
        spawnTimer = 0;
      }

      for (const block of obstacles) {
        block.y += block.vy;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const b = obstacles[i];
        if (b.y > H + 80) {
          obstacles.splice(i, 1);
        }
      }

      for (const b of obstacles) {
        const hit =
          player.x - player.w / 2 < b.x + b.w &&
          player.x + player.w / 2 > b.x &&
          player.y - player.h / 2 < b.y + b.h &&
          player.y + player.h / 2 > b.y;

        if (hit) {
          gameOver = true;
          best = Math.max(best, Math.floor(score));
          localStorage.setItem("dodge-best", best);
          bestEl.textContent = best;
          messageEl.classList.remove("hidden");
          return;
        }
      }

      score += 0.08;
      scoreEl.textContent = Math.floor(score);
    }

    function drawBackground() {
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, W, H);

      const sky = ctx.createLinearGradient(0, 0, 0, H / 2);
      sky.addColorStop(0, "#1d4ed8");
      sky.addColorStop(1, "#0f172a");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H / 2);

      // road perspective
      ctx.fillStyle = "#374151";
      ctx.beginPath();
      ctx.moveTo(W * 0.22, H * 0.12);
      ctx.lineTo(W * 0.78, H * 0.12);
      ctx.lineTo(W * 0.95, H);
      ctx.lineTo(W * 0.05, H);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 2;

      // road lane markers
      for (let i = 0; i < 4; i++) {
        const y = H * 0.18 + i * (H * 0.18);
        const leftX = W * 0.34 + i * 25;
        const rightX = W * 0.66 - i * 25;

        ctx.beginPath();
        ctx.moveTo(leftX, y);
        ctx.lineTo(W / 2 - 14, H * 0.87 + i * 24);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(rightX, y);
        ctx.lineTo(W / 2 + 14, H * 0.87 + i * 24);
        ctx.stroke();
      }

      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(W * 0.16, H * 0.12);
      ctx.lineTo(W * 0.06, H);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(W * 0.84, H * 0.12);
      ctx.lineTo(W * 0.94, H);
      ctx.stroke();

      ctx.fillStyle = "rgba(14, 165, 233, 0.18)";
      ctx.fillRect(0, H - 100, W, 100);
    }

    function drawPlayer() {
      const { x, y, w, h } = player;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(-w / 2, -h / 2, w, h);

      ctx.fillStyle = "rgba(224, 242, 254, 0.75)";
      ctx.fillRect(-w / 2 + 6, -h / 2 + 8, w - 12, h / 2 - 12);

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(-w / 2 - 2, -h / 2 + 4, 6, 14);
      ctx.fillRect(w / 2 - 4, -h / 2 + 4, 6, 14);
      ctx.fillRect(-w / 2 - 2, h / 2 - 18, 6, 14);
      ctx.fillRect(w / 2 - 4, h / 2 - 18, 6, 14);

      ctx.fillStyle = "#fef08a";
      ctx.fillRect(-w / 2 + 4, -h / 2 + 2, 6, 7);
      ctx.fillRect(w / 2 - 10, -h / 2 + 2, 6, 7);

      ctx.fillStyle = "#fca5a5";
      ctx.fillRect(-w / 2 + 4, h / 2 - 9, 6, 7);
      ctx.fillRect(w / 2 - 10, h / 2 - 9, 6, 7);

      ctx.restore();
    }

    function drawObstacle(b) {
      ctx.save();
      ctx.fillStyle = b.color;
      ctx.shadowBlur = 16;
      ctx.shadowColor = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.restore();

      ctx.strokeStyle = "rgba(0,0,0,0.4)";
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    }

    function draw() {
      drawBackground();

      for (const b of obstacles) {
        drawObstacle(b);
      }

      drawPlayer();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      keys[e.key] = true;
      keys[key] = true;

      if (!started && !gameOver) {
        startGame();
      }

      if (gameOver && e.code === "Space") {
        resetGame();
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
      keys[e.key.toLowerCase()] = false;
    });

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
